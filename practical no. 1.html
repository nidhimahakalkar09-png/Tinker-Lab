<!doctype html>
<html>
<head>
    <title>Lists and Table Example</title>
</head>
<body>
    <h2>List and Table Example</h2>

    <h3>Unordered List</h3>
    <ul type="square">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Orange</li>
    </ul>

    <h3>Ordered List</h3>
    <ol type="1">
        <li>HTML</li>
        <li>CSS</li>
        <li>Python</li>
        <li>Java script</li>
    </ol>

    <h2>Student Information</h2>
    <table border="2">
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Abc</td>
                <td>Math</td>
                <td>70</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Def</td>
                <td>Science</td>
                <td>77</td>
            </tr>
            <tr> 
                <td>3</td>
                <td>Ghi</td>
                <td>English</td>
                <td>80</td>
        </body>
    </table>

</body>
</html>
